<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello Pages</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #141414;
      color: #f2efe9;
      font-family: system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    main { padding: 24px; text-align: center; }
    h1 { font-size: clamp(32px, 8vw, 64px); margin: 0 0 16px; }
    .ver { color: #f26b3a; font-weight: 700; }
    p { color: #b5b0a8; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, Pages <span class="ver">v1</span></h1>
    <p>이 페이지는 GitHub Actions가 자동으로 배포했습니다.</p>
    <p>위의 v1을 v2로 고쳐서 push하면, 1~2분 뒤 이 화면이 바뀝니다.</p>
  </main>
</body>
</html>
